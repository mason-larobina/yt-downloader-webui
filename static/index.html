<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-dl</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
<script src="/static/htmx-ext-sse.js"></script>
</head>
<body hx-ext="sse">
<div class="app">

  <!-- Header: title + URL input (or, while probing, the streaming probe area). -->
  <header class="topbar">
    <span class="title">web-dl</span>
    <div id="header-input" class="header-input">
      <form class="submit"
            hx-post="/download" hx-target="#header-input" hx-swap="innerHTML"
            hx-disabled-elt="#dl-btn">
        <input type="text" name="url" placeholder="paste a URL"
               autocomplete="off" autofocus>
        <button type="submit" id="dl-btn">Add</button>
      </form>
    </div>
  </header>

  <!-- Main: downloads (cards) + per-video logs. -->
  <div class="main">
    <main class="pane pane-cards">
      <div id="cards" class="cards" sse-swap="queue" hx-swap="innerHTML">
        <div class="cards-head"><span class="cards-title">downloads</span></div>
        <div class="cards-list"><div class="empty">connecting&hellip;</div></div>
      </div>
    </main>

    <aside class="pane pane-logs" id="logs-pane">
      <div class="lp-empty">click <em>logs</em> on a video to view its yt-dlp output</div>
    </aside>
  </div>

</div>

<!-- Floating progress banner (spotify-like). Swapped live by the `status`
     SSE event; hidden via the `idle` class when the queue is empty. -->
<div id="status" class="banner idle" sse-swap="status" hx-swap="outerHTML"></div>

<!-- Transient ack toast: cancel/retry/clear/delete actions swap a short
     confirmation here; auto-cleared after a few seconds. -->
<div id="ack" class="ack-toast"></div>

<script>
  // Global SSE connection (htmx sse extension picks this up at body level).
  document.body.setAttribute('sse-connect', '/events');

  // Close the logs pane (called by the pane's own "close" button).
  window.closeLogs = function () {
    var pane = document.getElementById('logs-pane');
    pane.innerHTML = '<div class="lp-empty">click <em>logs</em> on a video to view its yt-dlp output</div>';
  };

  // Auto-stick the logs pane to the bottom while a download is in flight,
  // unless the user has scrolled up to read earlier output. The scroll
  // container (#lp-body) is never swapped by the poll, so its scrollTop
  // survives; we only nudge it after a line-swap when stuck.
  (function () {
    document.body.addEventListener('htmx:afterSwap', function (e) {
      var target = e.detail && e.detail.target;
      if (!target || target.id !== 'lp-lines') return;
      var body = document.getElementById('lp-body');
      if (!body) return;
      var stuck = body.scrollHeight - body.scrollTop - body.clientHeight > 60;
      if (!stuck) body.scrollTop = body.scrollHeight;
    });
  })();

  // Transient ack toast: POST actions (cancel/retry/clear/delete) swap a
  // short confirmation into #ack; auto-clear it after a few seconds so it
  // doesn't linger. (The live queue/progress state lives in the floating
  // banner, not here.)
  (function () {
    var timer = null;
    document.body.addEventListener('htmx:afterSwap', function (e) {
      var target = e.detail && e.detail.target;
      if (!target || target.id !== 'ack') return;
      if (!target.textContent.trim()) return;
      clearTimeout(timer);
      timer = setTimeout(function () { target.textContent = ''; }, 4000);
    });
  })();

  // Keep the "Confirm (N)" count in the probe result cards in sync with the
  // checked checkboxes (the cards are swapped in dynamically by the `result`
  // SSE event, so listen at the document level).
  (function () {
    document.addEventListener('change', function (e) {
      var box = e.target;
      if (!(box instanceof HTMLInputElement) || box.type !== 'checkbox') return;
      var form = box.closest('.probe-form');
      if (!form) return;
      var n = form.querySelectorAll('input[name="entry"]:checked').length;
      var el = form.querySelector('.sel-count');
      if (el) el.textContent = String(n);
    });
  })();

  // Focus the URL input whenever the header is restored to its normal form
  // (initial load, after a probe is cancelled/confirmed/discarded) so the
  // user can paste the next URL without reaching for the mouse.
  (function () {
    document.body.addEventListener('htmx:afterSwap', function (e) {
      var target = e.detail && e.detail.target;
      if (!target || target.id !== 'header-input') return;
      var input = target.querySelector('input[name="url"]');
      if (input) input.focus();
    });
  })();

  // Toggle the probe streaming logs on/off once a probe has finished (the
  // "show logs" / "hide logs" button in the actions row). The default
  // hide-on-success is handled purely in CSS (see .probe-area:has(.probe-form)
  // in app.css), so this only needs to flip the override class.
  window.toggleProbeLogs = function () {
    var area = document.getElementById('probe-area');
    if (!area) return;
    var showing = area.classList.toggle('show-logs');
    var btn = area.querySelector('.probe-logs-toggle');
    if (btn) btn.textContent = showing ? 'hide logs' : 'show logs';
  };
</script>
</body>
</html>
