<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-dl</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
<script src="/static/htmx-ext-sse.js"></script>
</head>
<body hx-ext="sse">
<div class="app">

  <!-- Left pane: submit + approval -->
  <aside class="pane pane-left">
    <header class="topbar">
      <span class="title">web-dl</span>
      <span class="dir" title="download directory">{{dir}}</span>
      <span class="cookies">cookies: {{cookies}}</span>
    </header>

    <form class="submit"
          hx-post="/download" hx-target="#approve" hx-swap="innerHTML"
          hx-disabled-elt="#dl-btn"
          hx-on::after-request="if(event.detail.successful) this.querySelector('textarea').value=''">
      <textarea name="urls" rows="6"
                placeholder="paste one URL per line&#10;https://..."></textarea>
      <div class="actions">
        <button type="submit" id="dl-btn">Download</button>
      </div>
    </form>

    <div id="approve" class="approve"></div>
    <span id="ack" class="ack"></span>
  </aside>

  <!-- Middle pane: per-video cards -->
  <main class="pane pane-cards">
    <div id="cards" class="cards" sse-swap="queue" hx-swap="innerHTML">
      <div class="cards-head"><span class="cards-title">downloads</span></div>
      <div class="cards-list"><div class="empty">connecting&hellip;</div></div>
    </div>
  </main>

  <!-- Right pane: per-video logs -->
  <aside class="pane pane-logs" id="logs-pane">
    <div class="lp-empty">click <em>logs</em> on a video to view its yt-dlp output</div>
  </aside>

</div>

<script>
  // Global SSE connection (htmx sse extension picks this up at body level).
  document.body.setAttribute('sse-connect', '/events');

  // Close the logs pane (called by the pane's own "close" button).
  window.closeLogs = function () {
    var pane = document.getElementById('logs-pane');
    pane.innerHTML = '<div class="lp-empty">click <em>logs</em> on a video to view its yt-dlp output</div>';
  };

  // Auto-stick the logs pane to the bottom while a download is in flight,
  // unless the user has scrolled up to read earlier output. The scroll
  // container (#lp-body) is never swapped by the poll, so its scrollTop
  // survives; we only nudge it after a line-swap when stuck.
  (function () {
    document.body.addEventListener('htmx:afterSwap', function (e) {
      var target = e.detail && e.detail.target;
      if (!target || target.id !== 'lp-lines') return;
      var body = document.getElementById('lp-body');
      if (!body) return;
      var stuck = body.scrollHeight - body.scrollTop - body.clientHeight > 60;
      if (!stuck) body.scrollTop = body.scrollHeight;
    });
  })();

  // Keep the "Download selected (N)" count in the approval list in sync with
  // the checked checkboxes (the list is swapped in dynamically by POST
  // /download, so listen at the document level).
  (function () {
    document.addEventListener('change', function (e) {
      var box = e.target;
      if (!(box instanceof HTMLInputElement) || box.type !== 'checkbox') return;
      var form = box.closest('.approvelist');
      if (!form) return;
      var n = form.querySelectorAll('input[name="entry"]:checked').length;
      var el = form.querySelector('.sel-count');
      if (el) el.textContent = String(n);
    });
  })();
</script>
</body>
</html>
