<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>downloads</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.org-2.0.4.js"></script>
<script src="/static/htmx-ext-sse-2.2.4.js"></script>
</head>
<body hx-ext="sse">
<div class="app">

  <!-- Header: URL input (or, while probing, the streaming probe area). -->
  <header class="topbar">
    <div id="header-input" class="header-input">
      <form class="submit"
            hx-post="/download" hx-target="#header-input" hx-swap="innerHTML"
            hx-disabled-elt="#dl-btn">
        <input type="text" name="url" placeholder="Paste a URL..."
               autocomplete="off" autofocus>
        <button type="submit" id="dl-btn">Add</button>
      </form>
    </div>
  </header>

  <!-- Main: downloads (cards). Per-video details live on the /item/:id page. -->
  <div class="main">
    <main class="pane pane-cards">
      <div id="cards" class="cards" sse-swap="queue" hx-swap="innerHTML">
        <div class="cards-head"><span class="cards-title">downloads</span><span id="cards-count" class="cards-count" sse-swap="cards-count" hx-swap="innerHTML"></span><button class="cards-rescan" hx-post="/rescan" hx-target="#ack" hx-swap="innerHTML" title="re-scan the download directory for added/removed files">rescan</button></div>
        <div id="cards-list" class="cards-list" sse-swap="card-added" hx-swap="afterbegin"><div class="empty">connecting&hellip;</div></div>
      </div>
    </main>
  </div>

</div>

<!-- Floating progress banner (spotify-like). A stable 3-column shell
     (never swapped on the hot path): left = thumbnail, middle = 4 lines
     (title / last log line / progress bar / progress text), right = cancel
     button. Each slot is its own `sse-swap` target so a progress tick swaps
     only the bar + meta fragments -- never the `<img>` thumbnail, which is
     what flashed when the whole `#status` `outerHTML` was swapped several
     times a second. Empty slots collapse via CSS `:empty`, and an empty
     `#status-title` hides the whole banner (the idle state). -->
<div id="status" class="banner">
  <div id="status-thumb" sse-swap="status-thumb" hx-swap="innerHTML"></div>
  <div class="bn-middle">
    <div class="bn-top" id="status-title" sse-swap="status-title" hx-swap="innerHTML"></div>
    <div class="bn-log" id="status-log" sse-swap="status-log" hx-swap="innerHTML"></div>
    <div class="bn-bar" id="status-bar" sse-swap="status-bar" hx-swap="innerHTML"></div>
    <div class="bn-meta" id="status-meta" sse-swap="status-meta" hx-swap="innerHTML"></div>
  </div>
  <div id="status-cancel" sse-swap="status-cancel" hx-swap="innerHTML"></div>
</div>

<!-- Transient ack toast: POST actions (cancel/retry/delete/rescan) swap a
     short confirmation here; the `toast` SSE event (e.g. a download that was
     de-duplicated against an existing item) swaps in too. Either way it
     auto-clears after a few seconds via the afterSwap listener below. -->
<div id="ack" class="ack-toast" sse-swap="toast" hx-swap="innerHTML"></div>

<script>
  // Global SSE connection (htmx sse extension picks this up at body level).
  document.body.setAttribute('sse-connect', '/events');

  // Transient ack toast: POST actions (cancel/retry/delete) swap a
  // short confirmation into #ack; auto-clear it after a few seconds so it
  // doesn't linger. (The live queue/progress state lives in the floating
  // banner, not here.)
  (function () {
    var timer = null;
    document.body.addEventListener('htmx:afterSwap', function (e) {
      var target = e.detail && e.detail.target;
      if (!target || target.id !== 'ack') return;
      if (!target.textContent.trim()) return;
      clearTimeout(timer);
      timer = setTimeout(function () { target.textContent = ''; }, 4000);
    });
  })();

  // Intercept Ctrl/Cmd+V anywhere on the page: drop the clipboard contents
  // into the URL field and submit the form immediately, so the user can
  // paste a URL without first focusing the input. Skipped while probing
  // (no URL input present) and never hijacks paste into another text field.
  (function () {
    document.addEventListener('paste', function (e) {
      var input = document.querySelector('#header-input input[name="url"]');
      if (!input) return; // header is showing the probe area
      var t = e.target;
      if ((t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement) && t !== input) {
        return; // let native paste happen in other fields
      }
      var text = e.clipboardData && e.clipboardData.getData('text');
      if (!text) return;
      text = text.trim();
      if (!text) return;
      e.preventDefault();
      input.value = text;
      if (input.form) input.form.requestSubmit();
    });
  })();

  // Keep the "Confirm (N)" count in the probe result cards in sync with the
  // checked checkboxes (the cards are swapped in dynamically by the `result`
  // SSE event, so listen at the document level).
  (function () {
    document.addEventListener('change', function (e) {
      var box = e.target;
      if (!(box instanceof HTMLInputElement) || box.type !== 'checkbox') return;
      var form = box.closest('.probe-form');
      if (!form) return;
      var n = form.querySelectorAll('input[name="entry"]:checked').length;
      var el = form.querySelector('.sel-count');
      if (el) el.textContent = String(n);
    });
  })();

  // Focus the URL input whenever the header is restored to its normal form
  // (initial load, after a probe is cancelled/confirmed/discarded) so the
  // user can paste the next URL without reaching for the mouse.
  (function () {
    document.body.addEventListener('htmx:afterSwap', function (e) {
      var target = e.detail && e.detail.target;
      if (!target || target.id !== 'header-input') return;
      var input = target.querySelector('input[name="url"]');
      if (input) input.focus();
    });
  })();

  // Toggle the probe streaming logs on/off once a probe has finished (the
  // "show logs" / "hide logs" button in the actions row). The default
  // hide-on-success is handled purely in CSS (see .probe-area:has(.probe-form)
  // in app.css), so this only needs to flip the override class.
  window.toggleProbeLogs = function () {
    var area = document.getElementById('probe-area');
    if (!area) return;
    var showing = area.classList.toggle('show-logs');
    var btn = area.querySelector('.probe-logs-toggle');
    if (btn) btn.textContent = showing ? 'hide logs' : 'show logs';
  };

  // Select / deselect every probe card at once (useful for large playlists).
  // Setting .checked directly doesn't fire a change event, so we dispatch one
  // so the existing listener updates the "Confirm (N)" count + the card's
  // selected/unselected border styling (which is :has(input:checked) based).
  function probeBulkSet(checked) {
    var form = document.querySelector('.probe-form');
    if (!form) return;
    form.querySelectorAll('input[name="entry"]').forEach(function (box) {
      box.checked = checked;
      box.dispatchEvent(new Event('change', { bubbles: true }));
    });
  }
  window.probeSelectAll = function () { probeBulkSet(true); };
  window.probeSelectNone = function () { probeBulkSet(false); };
</script>
</body>
</html>
