[package]
name = "yt-downloader-webui"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/mason-larobina/yt-downloader-webui"
readme = "README.md"
authors = ["Mason Larobina <mason.larobina@pm.me>"]
description = "A standalone, single-binary web UI wrapper around yt-dlp: paste URLs, queue downloads, and watch live progress in the browser."
license = "MIT"
keywords = ["yt-dlp", "youtube", "downloader", "webui", "htmx"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["form", "http2"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
form_urlencoded = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-journald = "0.3"
dirs = "6"
futures-util = "0.3"
mime_guess = "2"
async-stream = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
sha1 = "0.11"
askama = { version = "0.16", features = ["urlencode", "serde_json"] }
