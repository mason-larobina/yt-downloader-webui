<div class="lp-head"><span class="lp-title">logs</span><span class="lp-label">{{ label }}</span><span class="lp-status {{ status }}">{{ status }}</span><button class="lp-close" type="button" onclick="closeLogs()">close</button></div><div id="lp-body" class="lp-body"><div id="lp-lines" class="lp-lines"{% if polling %} hx-get="/logs/{{ id }}?lines=1" hx-trigger="every 2s" hx-target="this" hx-swap="innerHTML"{% endif %}>{% if lines.is_empty() %}<div class="lp-empty-lines">(no output yet)</div>{% else %}{% for l in lines %}<div class="logline">{{ l }}</div>{% endfor %}{% endif %}</div></div>
