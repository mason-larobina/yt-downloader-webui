<div class="cards-head">
  <span class="cards-title">downloads</span>
  <span id="cards-count" class="cards-count" sse-swap="cards-count" hx-swap="innerHTML">{{ count }}</span>
  <button class="cards-rescan" hx-post="/rescan" hx-target="#ack" hx-swap="innerHTML" title="re-scan the download directory for added/removed files">rescan</button>
</div>
<div id="cards-list" class="cards-list" sse-swap="card-added" hx-swap="afterbegin">
  {% for c in cards %}{{ c|safe }}{% endfor %}
  <div class="empty">no videos yet &mdash; paste a URL</div>
</div>
