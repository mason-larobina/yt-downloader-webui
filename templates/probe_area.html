<div id="probe-area" class="probe-area" sse-connect="/probe?url={{ url|urlencode_strict }}" sse-close="result">
  <div class="probe-head">
    <span class="probe-status">probing&hellip;</span>
    <button type="button" class="probe-cancel" hx-get="/header" hx-target="#header-input" hx-swap="innerHTML">cancel</button>
  </div>
  <div id="probe-stream" class="probe-stream" sse-swap="log" hx-swap="beforeend"></div>
  <div id="probe-cards" class="probe-cards" sse-swap="result" hx-swap="innerHTML"></div>
</div>
